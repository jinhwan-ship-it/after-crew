<!doctype html><html lang="ko"><head><meta charset="utf-8"><script src="../../app/data/map.js"></script>
<style>
body{margin:0;background:#DCE1E5;font-family:"Noto Sans KR",sans-serif;color:#1E3A4C;word-break:keep-all}
.wrap{display:flex;gap:32px;padding:32px}
.card{width:390px;background:#fff;border-radius:24px;overflow:hidden}
.card h2{font-size:18px;margin:20px 24px 4px}
.card p{font-size:14px;color:#5B6F7C;margin:0 24px 12px}
.map{width:390px;height:420px;display:block;background:#F2F4F5}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;padding:16px 24px 24px;font-size:14px}
.leg span{display:flex;align-items:center;gap:8px}
.leg i{display:inline-block;width:28px;height:5px;border-radius:3px}
.leg small{color:#5B6F7C;font-family:Archivo,sans-serif}
.dash{background:repeating-linear-gradient(90deg,#5B6F7C 0 3px,transparent 3px 8px)!important;height:3px!important}
</style></head><body><div class="wrap" id="w"></div>
<script>
const M=window.AC_MAP;
const ACT={c1:'walk',c2:'jog',c3:'bike',c4:'run',c5:'walk',c6:'walk',c7:'jog',c8:'run'};
const LBL={walk:'산책',jog:'조깅',run:'러닝',bike:'라이트 바이크'};
const SETS={A:{name:'A · 차분한 4색',desc:'브랜드 블루와 같은 채도. 지도 위에서 조용하게 쌓인다',c:{walk:'#2E7D66',jog:'#2E6AAE',run:'#C2452B',bike:'#1E3A4C'}},
            B:{name:'B · 선명한 4색',desc:'채도를 올려 한눈에 구분. 완주한 코스가 더 튄다',c:{walk:'#0E8C6A',jog:'#2A7BD0',run:'#E04E36',bike:'#1E3A4C'}}};
function lum(h){const r=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c<=0.03928?c/12.92:((c+0.055)/1.055)**2.4);return 0.2126*r[0]+0.7152*r[1]+0.0722*r[2];}
const cr=(a,b)=>{const x=lum(a),y=lum(b);return ((Math.max(x,y)+0.05)/(Math.min(x,y)+0.05)).toFixed(1)};
function mapSVG(col,done){
  const vb='20 80 620 668';
  let r='';
  for(const [k,v] of Object.entries(M.routes)){ const d=done.includes(k); const c=col[ACT[k]];
    r+= d? `<polyline points="${v.pts}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>` : `<polyline points="${v.pts}" fill="none" stroke="#5B6F7C" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 9"/>`; }
  return `<svg class="map" viewBox="${vb}" preserveAspectRatio="xMidYMid slice"><rect x="-50" y="-50" width="1100" height="950" fill="#F2F4F5"/><path d="${M.parks}" fill="#E0E8DE"/><path d="${M.water}" fill="#D3DEE6" fill-rule="evenodd"/><path d="${M.streams}" fill="none" stroke="#B9CCD8" stroke-width="3"/><path d="${M.minor}" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/><path d="${M.major}" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>${r}</svg>`;
}
document.getElementById('w').innerHTML=Object.values(SETS).map(s=>`<div class="card"><h2>${s.name}</h2><p>${s.desc}</p>${mapSVG(s.c,['c1','c2','c3','c4','c6'])}<div class="leg">${Object.entries(s.c).map(([k,v])=>`<span><i style="background:${v}"></i>${LBL[k]} <small>${v} · ${cr(v,'#F2F4F5')}:1</small></span>`).join('')}<span><i class="dash"></i>아직 안 가본 코스 <small>#5B6F7C · ${cr('#5B6F7C','#F2F4F5')}:1</small></span></div></div>`).join('');
</script></body></html>
