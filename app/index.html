<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>애프터 크루 · 앱 프로토타입 r7</title>
<meta name="description" content="퇴근 후 동네 운동 모임 애프터 크루의 모바일 앱 프로토타입. 동행자와 길잡이 흐름, 회차 대화방, 내 동네 지도.">
<meta name="theme-color" content="#1E3A4C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="desk">
  <div class="phone" id="phone">
    <div class="statusbar" id="statusbar">
      <span id="clock">18:55</span>
      <span class="sig" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2" width="3" height="10" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="2" y="2" width="19" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
      </span>
    </div>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="주 메뉴"></nav>
    <div id="sheet-root"></div>
    <div id="live" class="sr" aria-live="polite"></div>
  </div>
  <aside class="demo" aria-label="프로토타입 안내">
    <h2>애프터 크루 · 앱 프로토타입 r7</h2>
    <p>동행자: 찾기 → 회차 → 신청 → 대화방 → 당일 체크인 → 해산 → 내 동네 지도.<br>길잡이: 찾기 상단 "회차 열기" → 개설 → 대화방 → 당일 현황 → 출발 → 해산 → 대화방 닫기.</p>
    <p>기준 시각 2026-09-29 (화) 18:55 고정. 지도는 OpenStreetMap 실지형. 닉네임·대화는 시연용 예시. 데이터는 이 브라우저에만 저장.</p>
    <button type="button" data-demo="reset">처음 상태로 되돌리기</button>
    <button type="button" data-demo="find">동행자로 시작 (찾기)</button>
    <button type="button" data-demo="chat">오늘 회차 대화방 보기</button>
    <button type="button" data-demo="host">길잡이로 시작 (회차 열기)</button>
    <button type="button" data-demo="me">나 · 프로필과 설정</button>
  </aside>
</div>
<script src="data/map.js"></script>
<script src="data/content.js"></script>
<script src="app.js"></script>
</body>
</html>
